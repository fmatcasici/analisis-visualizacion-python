name: Publicar libro en GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install "jupyter-book<2"

      - name: Construir el libro
        run: |
          jupyter-book build . --keep-going -W

      - name: Verificar que se generó _build/html
        run: |
          echo "Contenido de _build (si existe):"
          ls -la _build || echo "La carpeta _build no existe."
          if [ ! -d "_build/html" ]; then
            echo "::error::jupyter-book no generó _build/html. Revisa el log del paso 'Construir el libro' arriba."
            exit 1
          fi

      - name: Publicar en la rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_build/html